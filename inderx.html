<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skill Game</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .box {
      max-width: 420px;
      margin: 50px auto;
      padding: 25px;
    }

    h1 {
      font-size: 36px;
    }

    p {
      color: #aaa;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 15px;
      border: 0;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #create {
      background: #00c853;
      color: white;
    }

    #join {
      background: #2979ff;
      color: white;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      border-radius: 10px;
      border: 1px solid #555;
      background: #222;
      color: white;
      font-size: 17px;
      text-align: center;
    }

    #message {
      margin-top: 20px;
      color: #ffcc00;
      min-height: 25px;
    }

    #result {
      display: none;
      margin-top: 20px;
      padding: 20px;
      background: #222;
      border-radius: 10px;
    }

    #showCode {
      color: #00e676;
      font-size: 32px;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>🎮 Skill Game</h1>

  <p>Play. Compete. Win.</p>

  <button id="create">CREATE ROOM</button>

  <input
    id="roomCode"
    placeholder="Enter Room Code"
    autocomplete="off"
  >

  <button id="join">JOIN ROOM</button>

  <div id="message"></div>

  <div id="result">
    <div>Your Room Code</div>
    <h2 id="showCode"></h2>
  </div>

</div>

<script>

const SUPABASE_URL =
  "https://fgrlghzfggfnvnxyntbe.supabase.co";

const SUPABASE_KEY =
  "YOUR_SUPABASE_PUBLISHABLE_KEY";


function message(text) {
  document.getElementById("message").textContent = text;
}


function getPlayerId() {

  let id = localStorage.getItem("skill_player_id");

  if (!id) {
    id = crypto.randomUUID();
    localStorage.setItem("skill_player_id", id);
  }

  return id;
}


function makeRoomCode() {

  const chars =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let code = "";

  for (let i = 0; i < 5; i++) {
    code += chars[
      Math.floor(Math.random() * chars.length)
    ];
  }

  return code;
}


async function createRoom() {

  message("Room create ho raha hai...");

  const roomCode = makeRoomCode();

  try {

    const response = await fetch(
      SUPABASE_URL + "/rest/v1/game_room",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY,
          "Prefer": "return=representation"
        },

        body: JSON.stringify({
          id: crypto.randomUUID(),
          room_code: roomCode,
          status: "waiting",
          max_players: 4
        })
      }
    );

    const data = await response.json();

    console.log("CREATE:", data);

    if (!response.ok) {

      message(
        "❌ Create error: " +
        (data.message || "Unknown error")
      );

      return;
    }

    document.getElementById("showCode")
      .textContent = data[0].room_code;

    document.getElementById("result")
      .style.display = "block";

    message("✅ Room database me create ho gaya!");

  } catch (error) {

    console.log(error);

    message(
      "❌ Connection error: " +
      error.message
    );
  }
}


async function joinRoom() {

  message("JOIN button chal raha hai...");

  const code =
    document.getElementById("roomCode")
      .value
      .trim()
      .toUpperCase();

  if (!code) {

    message("❌ Room Code enter karo");

    return;
  }

  message("Room check ho raha hai...");

  try {

    const url =
      SUPABASE_URL +
      "/rest/v1/game_room" +
      "?room_code=eq." +
      encodeURIComponent(code) +
      "&select=id,room_code,status,max_players";

    const response = await fetch(
      url,
      {
        method: "GET",

        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY
        }
      }
    );

    const data = await response.json();

    console.log("JOIN:", data);

    if (!response.ok) {

      message(
        "❌ Join error: " +
        (data.message || "Unknown error")
      );

      return;
    }

    if (data.length === 0) {

      message("❌ Room nahi mila");

      return;
    }

    if (data[0].status !== "waiting") {

      message("❌ Room waiting me nahi hai");

      return;
    }

    localStorage.setItem(
      "skill_room_code",
      code
    );

    message(
      "✅ Room mil gaya: " + code
    );

  } catch (error) {

    console.log(error);

    message(
      "❌ Connection error: " +
      error.message
    );
  }
}


document.getElementById("create")
  .addEventListener("click", createRoom);


document.getElementById("join")
  .addEventListener("click", joinRoom);

</script>

</body>
</html>
