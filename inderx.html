<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skill Game</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    .box {
      max-width: 420px;
      margin: 60px auto;
      padding: 25px;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 8px;
    }

    p {
      color: #aaa;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 15px;
      border: 0;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #create {
      background: #00c853;
      color: white;
    }

    #join {
      background: #2979ff;
      color: white;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      border-radius: 10px;
      border: 1px solid #555;
      background: #222;
      color: white;
      font-size: 17px;
      text-align: center;
    }

    #result {
      margin-top: 25px;
      padding: 15px;
      background: #222;
      border-radius: 10px;
      display: none;
    }

    #roomLink {
      word-break: break-all;
      color: #00e676;
      margin-top: 10px;
    }

    #message {
      margin-top: 20px;
      color: #ffcc00;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>🎮 Skill Game</h1>
    <p>Play. Compete. Win.</p>

    <button id="create">CREATE ROOM</button>

    <input id="roomCode" placeholder="Enter Room Code">

    <button id="join">JOIN ROOM</button>

    <div id="message"></div>

    <div id="result">
      <div>Your Room Code</div>
      <h2 id="showCode"></h2>
      <div id="roomLink"></div>
    </div>

  </div>


<script>

const SUPABASE_URL =
  "https://fgrlghzfggfnvnxyntbe.supabase.co";

const SUPABASE_KEY =
  "YOUR_SUPABASE_PUBLISHABLE_KEY";


function createPlayerId() {

  let playerId = localStorage.getItem("skill_player_id");

  if (!playerId) {
    playerId = crypto.randomUUID();
    localStorage.setItem("skill_player_id", playerId);
  }

  return playerId;
}


async function createRoom() {

  const message = document.getElementById("message");

  message.textContent = "Room create ho raha hai...";

  const playerId = createPlayerId();

  const response = await fetch(
    SUPABASE_URL + "/rest/v1/rpc/create_game_room",
    {
      method: "POST",

      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY
      },

      body: JSON.stringify({
        p_player_id: playerId,
        p_display_name: "Player"
      })
    }
  );


  const data = await response.json();


  if (!response.ok) {

    console.log(data);

    message.textContent =
      "Room create nahi hua: " +
      (data.message || data.hint || "Unknown error");

    return;
  }


  const code = data.room_code;

  document.getElementById("showCode").textContent = code;


  const link =
    window.location.origin +
    window.location.pathname +
    "?room=" +
    code;


  document.getElementById("roomLink").textContent = link;

  document.getElementById("result").style.display = "block";

  message.textContent =
    "✅ Room database mein create ho gaya!";
}


document.getElementById("create").onclick =
  createRoom;


document.getElementById("join").onclick =
  function () {

    const code =
      document.getElementById("roomCode")
      .value
      .trim()
      .toUpperCase();


    if (!code) {

      alert("Room Code enter karo");

      return;
    }


    window.location.href =
      window.location.pathname +
      "?room=" +
      code;
  };


</script>

</body>
</html>
