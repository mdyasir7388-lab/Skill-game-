<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skill Game</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    .box {
      max-width: 420px;
      margin: 60px auto;
      padding: 25px;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 8px;
    }

    p { color: #aaa; }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 15px;
      border: 0;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
    }

    #create {
      background: #00c853;
      color: white;
    }

    #join {
      background: #2979ff;
      color: white;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      border-radius: 10px;
      border: 1px solid #555;
      background: #222;
      color: white;
      font-size: 17px;
      text-align: center;
    }

    #result {
      margin-top: 25px;
      padding: 15px;
      background: #222;
      border-radius: 10px;
      display: none;
    }

    #roomLink {
      word-break: break-all;
      color: #00e676;
      margin-top: 10px;
    }

    #message {
      margin-top: 20px;
      color: #ffcc00;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>🎮 Skill Game</h1>
  <p>Play. Compete. Win.</p>

  <button id="create">CREATE ROOM</button>

  <input id="roomCode" placeholder="Enter Room Code">

  <button id="join">JOIN ROOM</button>

  <div id="message"></div>

  <div id="result">
    <div>Your Room Code</div>
    <h2 id="showCode"></h2>
    <div id="roomLink"></div>
  </div>

</div>

<script>

const SUPABASE_URL =
  "https://fgrlghzfggfnvnxyntbe.supabase.co";

const SUPABASE_KEY =
  "YOUR_SUPABASE_PUBLISHABLE_KEY";


function getPlayerId() {

  let id = localStorage.getItem("skill_player_id");

  if (!id) {
    id = crypto.randomUUID();
    localStorage.setItem("skill_player_id", id);
  }

  return id;
}


async function createRoom() {

  const message = document.getElementById("message");

  message.textContent = "Room create ho raha hai...";

  const playerId = getPlayerId();

  const response = await fetch(
    SUPABASE_URL + "/rest/v1/game_room",
    {
      method: "POST",

      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Prefer": "return=representation"
      },

      body: JSON.stringify({
        id: crypto.randomUUID(),
        room_code: Math.random()
          .toString(36)
          .substring(2, 7)
          .toUpperCase(),
        status: "waiting",
        max_players: 4
      })
    }
  );

  const data = await response.json();

  console.log(data);

  if (!response.ok) {

    message.textContent =
      "Room create error: " +
      (data.message || "Unknown error");

    return;
  }

  const room = data[0];

  document.getElementById("showCode").textContent =
    room.room_code;

  document.getElementById("roomLink").textContent =
    window.location.origin +
    window.location.pathname +
    "?room=" +
    room.room_code;

  document.getElementById("result").style.display =
    "block";

  message.textContent =
    "✅ Room database mein create ho gaya!";
}


async function joinRoom() {

  const message = document.getElementById("message");

  const code =
    document.getElementById("roomCode")
    .value
    .trim()
    .toUpperCase();

  if (!code) {
    message.textContent = "Room Code enter karo";
    return;
  }

  message.textContent =
    "Room check ho raha hai...";

  const response = await fetch(
    SUPABASE_URL +
    "/rest/v1/game_room?room_code=eq." +
    encodeURIComponent(code) +
    "&select=id,room_code,status,max_players",
    {
      method: "GET",

      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY
      }
    }
  );

  const data = await response.json();

  console.log(data);

  if (!response.ok || data.length === 0) {

    message.textContent =
      "❌ Room nahi mila";

    return;
  }

  if (data[0].status !== "waiting") {

    message.textContent =
      "❌ Room ab waiting mein nahi hai";

    return;
  }

  localStorage.setItem(
    "skill_room_code",
    code
  );

  message.textContent =
    "✅ Room mil gaya!";

  window.location.href =
    window.location.pathname +
    "?room=" +
    code;
}


document.getElementById("create").onclick =
  createRoom;

document.getElementById("join").onclick =
  joinRoom;

</script>

</body>
</html>
